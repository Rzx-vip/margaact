<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MARGA ACE'TE</title>
<style>
:root{--c:#5fd0ff}*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:#0a1118;color:#eaf6ff;font:15px system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:var(--bg,var(--logo)) center/cover;filter:blur(30px) brightness(.45);transform:scale(1.2);z-index:-1}
header{text-align:center;padding:calc(18px + env(safe-area-inset-top,0px)) 0 6px}
#lg{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--c);box-shadow:0 0 28px var(--c);cursor:pointer;user-select:none}
h1{font-size:22px;letter-spacing:3px;margin-top:8px;text-shadow:0 0 14px var(--c)}
#st{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62vh;padding:14px;max-width:560px;margin:auto;overflow:hidden}
.sc{width:100%;display:flex;flex-direction:column;gap:12px}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04));backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 40px rgba(0,0,0,.4);border-radius:26px;padding:16px;word-break:break-word}
.sub{opacity:.75;font-size:13px;line-height:1.5}
input,textarea{width:100%;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font:inherit;margin:4px 0}
textarea{min-height:70px}
.btn,.cp,.tg{border:0;border-radius:18px;padding:12px 18px;font:600 15px system-ui;color:#04222f;background:linear-gradient(135deg,#fff,var(--c));cursor:pointer;text-align:center;text-decoration:none;display:block}
.big{font-size:18px;padding:16px 34px;margin:auto;animation:pl 2s infinite}@keyframes pl{50%{box-shadow:0 0 30px var(--c)}}
.cp{padding:8px 14px;font-size:13px;flex:none}.tg{background:none;color:#fff;font-weight:400;font-size:13px;opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:20px;animation:up .5s calc(var(--i,0)*.07s) both}
.ok{border-color:#3dff8b;background:rgba(40,200,100,.22)}.bad{border-color:#ff5a6a;background:rgba(220,40,60,.22)}
.bar{height:10px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--c);transition:width 1s linear}
.out{animation:dn .42s ease-in forwards}@keyframes dn{to{transform:translateY(60vh);opacity:0;filter:blur(6px)}}
.in{animation:up .55s cubic-bezier(.2,.9,.3,1) both}@keyframes up{from{transform:translateY(-50px);opacity:0;filter:blur(8px)}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;overflow:auto}
.pn{width:100%;max-width:440px;max-height:90vh;overflow:auto}.pn label{display:block;font-size:12px;margin-top:8px;opacity:.85}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;font-size:30px;z-index:8;border:0;background:var(--c);color:#04222f;box-shadow:0 0 22px var(--c)}
#tt img,#tt video{max-width:100%;border-radius:16px;margin-top:8px}#tt{display:flex;flex-direction:column;gap:8px}
</style></head><body>

addEventListener("contextmenu",e=>e.preventDefault())})();

for(let o=0;o<y.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=y[o+4*i]<<24|y[o+4*i+1]<<16|y[o+4*i+2]<<8|y[o+4*i+3];
for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=w[i-16]+(r(a,7)^r(a,18)^a>>>3)+w[i-7]+(r(b,17)^r(b,19)^b>>>10)|0}
let[a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t=h+(r(e,6)^r(e,11)^r(e,25))+(e&f^~e&g)+K[i]+w[i]|0,u=(r(a,2)^r(a,13)^r(a,22))+(a&b^a&c^b&c)|0;h=g;g=f;f=e;e=d+t|0;d=c;c=b;b=a;a=t+u|0}
H=H.map((x,i)=>x+[a,b,c,d,e,f,g,h][i]|0)}return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("")}
const sha=async s=>window.crypto&&crypto.subtle?[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join(""):sha256js(s);
// normalisasi font aesthetic -> huruf biasa
const SF="ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘǫʀꜱᴛᴜᴠᴡxʏᴢ",ST="abcdefghijklmnopqrstuvwxyz";
const norm=s=>{let o="";for(let ch of String(s||"")){const i=SF.indexOf(ch);if(i>=0)ch=ST[i];else{const c=ch.codePointAt(0);for(const b of[0x1F130,0x1F150,0x1F170])if(c>=b&&c<b+26)ch=ST[c-b]}o+=ch}
return o.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"")};
const hasAny=(txt,list)=>{const n=norm(txt);return list.map(norm).filter(Boolean).some(w=>n.includes(w))};
const tagsOf=t=>(String(t||"").match(/#[^\s#]+/gu)||[]).map(norm);
// swipe down
function go(h,cb){const o=[...st.children];o.forEach(e=>e.classList.add("out"));setTimeout(()=>{st.innerHTML=`<div class="sc in">${h}</div>`;cb&&cb()},o.length?430:0)}
function toast(m){const t=document.createElement("div");t.className="glass";t.style.cssText="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:20;padding:10px 18px";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)}
async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement("textarea");a.value=t;document.body.append(a);a.select();document.execCommand("copy");a.remove()}const o=b.textContent;b.textContent="Tersalin ✓";setTimeout(()=>b.textContent=o,1200)}
st.onclick=e=>{const b=e.target.closest(".cp");if(b)copy(b.dataset.t,b);const g=e.target.closest(".tg");if(g){const t=$("#tt");t.hidden=!t.hidden;g.textContent="Klick disini untuk cara seleksi nya  "+(t.hidden?"v":"^")}};
function theme(){document.documentElement.style.setProperty("--c",D.accent);if(D.bg)document.body.style.setProperty("--bg",`url(${CSS.escape?JSON.stringify(D.bg):D.bg})`);$("#ttl").textContent=D.title}
async function init(){$("#lg").src=LOGO;document.body.style.setProperty("--logo",`url(${LOGO})`);$("#ttl").textContent="MARGA ACE'TE";
try{D=await bin("GET");if(!valid(D))throw Error("skema");}catch(e){go(`<div class="glass"><b>Data website tidak sesuai / tidak bisa dimuat.</b><p class=sub>Hubungi admin. (${esc(e.message)})</p></div>`);D=null;return}
theme();home();
if(!sessionStorage.v){sessionStorage.v=1;D.views++;bin("PUT",D).catch(()=>{})}}
const home=()=>go(`<p class=sub style="text-align:center">Komunitas Editing Creator</p><button class="btn big" id=go>Mulai Seleksi</button>`,()=>$("#go").onclick=sel);
const sel=()=>go(`<div class=glass><b>Ambil CN</b><p class=sub>Masukan Nama mu Untuk Mengambil Cn atau jika tidak ingin Menggunakan nama/mengambil cn marga act cukup langsung klick generate</p><input id=nm maxlength=${D.nameMax} placeholder="Nama (maks ${D.nameMax} karakter)"><button class=btn id=gen>Generate</button></div>`,()=>$("#gen").onclick=gen);
const card=(t,i)=>`<div class="glass row" style="--i:${i}"><span>${esc(t)}</span><button class=cp data-t="${esc(t)}">Copy</button></div>`;
function gen(){const n=$("#nm").value.trim();if(n.length>D.nameMax||!/^[\p{L}\p{N} ._-]*$/u.test(n))return toast("Nama tidak sesuai parameter");
const sec=(h,a)=>a.length?`<b>${h}</b>${a.map(card).join("")}`:"";
const tut=(D.tutTexts.length||D.tutMedia.length)?`<button class=tg>Klick disini untuk cara seleksi nya  v</button><div id=tt class=glass hidden>${D.tutTexts.map(t=>`<p>${esc(t)}</p>`).join("")}${D.tutMedia.map(u=>/\.(mp4|webm)(\?|$)/i.test(u)?`<video src="${esc(safe(u))}" controls playsinline></video>`:`<img src="${esc(safe(u))}" alt="">`).join("")}</div>`:"";
go(sec("CN",D.cn.map(c=>(n?n+" ":"")+c))+sec("Copy Bio Profile",D.bioList)+sec("Hashtag",D.tags)+`<div class=glass><b>Cek Seleksi</b><p class=sub>Tempel link video TikTok (format apa pun) atau @username. 1) Cek CN di nickname 2) Cek bio 3) Cek hashtag di video.</p><input id=ui placeholder="@hk.rezzxaep atau https://vt.tiktok.com/..."><button class=btn id=ck>Cek Sekarang</button><div id=rs style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div></div>`+tut,()=>$("#ck").onclick=run)}
async function tk(p,o={}){let j;try{j=await (await fetch((CFG.PROXY||"/api/tk")+"?"+new URLSearchParams({p,...o}))).json()}catch{throw Error("Fungsi /api/tk belum aktif. Pastikan sudah di-deploy ke Vercel (atau jalankan vercel dev)")}if(j.code!==0)throw Error(j.msg||"API TikTok gagal");return j.data}
async function run(){const v=$("#ui").value.trim(),rs=$("#rs"),b=$("#ck");if(!v)return toast("Isi username / URL dulu");
b.disabled=true;rs.innerHTML='<div class="glass row">Memeriksa…</div>';
try{const isU=/tiktok\.com|^https?:/i.test(v);let uid,vids=[],pf=null;
if(isU){const d=await tk("/",{url:/^https?:/i.test(v)?v:"https://"+v});uid=d.author.unique_id;vids=[d];pf=d.profile}else uid=v.replace(/^@/,"");
let u;if(pf&&(pf.nickname||pf.signature))u=pf;else{await sleep(1100);u=(await tk("/user/info",{unique_id:uid})).user}
if(!isU){let cur=0;for(let i=0;i<5;i++){await sleep(1100);const p=await tk("/user/posts",{unique_id:uid,count:30,cursor:cur});vids.push(...(p.videos||[]));if(!p.hasMore)break;cur=p.cursor}}
const r1=hasAny(u.nickname,D.cn),r2=hasAny(u.signature,D.bio);
const req=D.tags.map(norm).filter(Boolean);
const hit=vids.filter(x=>{const t=tagsOf(x.title);return req.length&&(D.tagAll?req.every(q=>t.includes(q)):req.some(q=>t.includes(q)))});
const row=(ok,h,d)=>`<div class="glass row ${ok?"ok":"bad"}" style="display:block"><b>${ok?"✔":"✘"} ${h}</b><div class=sub>${d}</div></div>`;
let h=row(r1,"1. CN di nickname","Nickname: "+esc(u.nickname))+row(r2,"2. Bio","Bio: "+esc(u.signature||"(kosong)"));
h+=hit.length?hit.map(x=>{const id=x.video_id||x.id,l=`https://www.tiktok.com/@${uid}/video/${id}`;return row(true,"3. Hashtag cocok",`<a style="color:#9ff" href="${l}" target=_blank rel=noopener>${l}</a><br>❤ ${x.digg_count} · 💬 ${x.comment_count} · ↗ ${x.share_count}<br>${esc(x.title)}`)}).join(""):row(false,"3. Hashtag",`Tidak ada video yang memuat hashtag wajib. Video diperiksa: ${vids.length}`);
rs.innerHTML=h;if(r1&&r2&&hit.length)setTimeout(win,1800)}
catch(e){rs.innerHTML=`<div class="glass row bad">Gagal mengambil data TikTok: ${esc(e.message)}</div>`}b.disabled=false}
function win(){const T=D.expire;let n=T;const ex=D.extra.map(x=>x.split("|")).filter(a=>a[1]).map(a=>`<a class=btn href="${esc(safe(a[1]))}" target=_blank rel=noopener>${esc(a[0])}</a>`).join("");
go(`<div class="glass sc" style="text-align:center"><h2>SELEKSI LOLOS!</h2><p>Silahkan Klick button url dibawah,karena masa expired waktu ini akan habis dalam ${Math.round(T/60)} menit</p><div class=bar><i id=pb></i></div><b id=tm></b><a class=btn href="${esc(safe(D.groupUrl))}" target=_blank rel=noopener>Join Group</a><p class=sub>Ada kendala?Silahkan Chat admin Di group Seleksi atau owner group</p><a class=btn href="${esc(safe(D.helpUrl))}" target=_blank rel=noopener>${esc(D.helpText)}</a>${ex}</div>`,()=>{const iv=setInterval(()=>{n--;const p=$("#pb");if(!p||n<=0){clearInterval(iv);return n<=0&&home()}p.style.width=n/T*100+"%";$("#tm").textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,"0")}`},1000)})}
// ===== ADMIN =====
let c3=0,tm;$("#lg").onclick=()=>{clearTimeout(tm);if(++c3>=3){c3=0;login()}else tm=setTimeout(()=>c3=0,1500)};
function ovl(h){const o=document.createElement("div");o.className="ov";o.innerHTML=h;o.onclick=e=>{if(e.target==o)o.remove()};document.body.append(o);return o}
function login(){if(!D)return toast("Data belum valid");const o=ovl(`<div class="glass pn"><b>Admin</b><input id=au placeholder="Username" autocomplete=off autocapitalize=off autocorrect=off spellcheck=false><input id=ap type=password placeholder="Password" autocapitalize=off><button class=btn id=al style="margin-top:8px;width:100%">Masuk</button></div>`);
$("#al").onclick=async()=>{try{const u=$("#au").value.trim(),p=$("#ap").value.trim(),h=String(D.admin.h).trim(),isH=/^[0-9a-f]{64}$/i.test(h);
if(u.toLowerCase()!==String(D.admin.u).trim().toLowerCase())return toast("Username tidak cocok dengan data jsonbin");
const hp=await sha(p);if(isH?hp!==h.toLowerCase():p!==h)return toast("Password tidak cocok dengan data jsonbin");
if(!isH){D.admin.h=hp;bin("PUT",D).catch(()=>{})}o.remove();fab()}catch(e){toast("Error login: "+e.message)}}}
function fab(){if($("#fab"))return;const b=document.createElement("button");b.id="fab";b.textContent="+";b.onclick=panel;document.body.append(b)}
function panel(){const f=([k,l,t])=>t=="a"?`<label>${l}<textarea data-k=${k}>${esc(D[k].join("\n"))}</textarea></label>`:t=="k"?`<label><input type=checkbox data-k=${k} ${D[k]?"checked":""} style="width:auto"> ${l}</label>`:`<label>${l}<input data-k=${k} type=${t=="n"?"number":t=="c"?"color":"text"} value="${esc(D[k])}"></label>`;
const o=ovl(`<div class="glass pn"><b>Panel Admin · ${D.views} views</b>${F.map(f).join("")}<label>Username admin<input id=nu value="${esc(D.admin.u)}"></label><label>Password baru (kosong = tetap)<input id=np type=password></label><button class=btn id=sv style="margin-top:12px;width:100%">Simpan ke jsonbin</button></div>`);
$("#sv").onclick=async()=>{const nd=JSON.parse(JSON.stringify(D));o.querySelectorAll("[data-k]").forEach(e=>{const t=F.find(a=>a[0]==e.dataset.k)[2];nd[e.dataset.k]=t=="a"?e.value.split("\n").map(s=>s.trim()).filter(Boolean):t=="n"?Number(e.value):t=="k"?e.checked:e.value});
nd.admin.u=$("#nu").value.trim();if($("#np").value)nd.admin.h=await sha($("#np").value);
if(!valid(nd)||!nd.admin.u)return toast("Data tidak valid, ditolak");try{await bin("PUT",nd);D=nd;theme();o.remove();toast("Tersimpan ✓")}catch(e){toast("Gagal simpan: "+e.message)}}}
init();
</script></body></html>
